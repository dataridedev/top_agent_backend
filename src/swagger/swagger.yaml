    #         - Buying
    #         - Selling
    #     property:
    #       type: string
    #     budget_warranty:
    #       type: string
    #     finance:
    #       type: string
    #     purchase:
    #       type: string
    #     selling:
    #       type: string
    #     agent_specialization:
    #       type: string
    #     about:
    #       type: string

    CustomerCreate:
      type: object
      required:
        - city
      properties:
        property:
          type: string
          example: Condo
        move_time:
          type: string
          example: Within 3 months
        city:
          type: string
          example: Toronto
        communicate:
          type: string
          example: Email
        selling:
          type: string
          example: Residential Property
        agent_specialization:
          type: string
          example: Luxury Homes
        decision:
          type: string
          example: Ready to Buy
        created_at:
          type: string
          format: date-time
          example: "2026-06-16T10:30:00Z"

    Review:
      type: object
      properties:
        id:
          type: integer
        agent_id:
          type: integer
        platform:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        title:
          type: string
          nullable: true
        text:
          type: string
          nullable: true
        reviewer_name:
          type: string
        verified:
          type: boolean
        transaction_verified:
          type: boolean
        review_date:
          type: string
          format: date
        agent_responded:
          type: boolean
        agent_response:
          type: string
          nullable: true
        response_date:
          type: string
          format: date-time
          nullable: true
        property_address:
          type: string
          nullable: true
        transaction_type:
          type: string
          nullable: true
        rating_communication:
          type: integer
          nullable: true
        rating_negotiation:
          type: integer
          nullable: true
        rating_market_knowledge:
          type: integer
          nullable: true
        rating_responsiveness:
          type: integer
          nullable: true
        rating_pricing:
          type: integer
          nullable: true
        rating_paperwork:
          type: integer
          nullable: true
        rating_availability:
          type: integer
          nullable: true
        rating_recommendation:
          type: integer
          nullable: true
        imported_at:
          type: string
          format: date-time

    ReviewCreate:
      type: object
      required: [agent_id, rating, reviewer_name, reviewer_email]
      properties:
        agent_id:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        reviewer_name:
          type: string
          maxLength: 100
        reviewer_email:
          type: string
          format: email
        title:
          type: string
          maxLength: 200
        text:
          type: string
          maxLength: 5000
        platform:
          type: string
          enum: [native, google, rew, ratemyagent, ratemyagentcom, facebook, zillow]
          default: native
        platform_review_id:
          type: string
        platform_url:
          type: string
          format: uri
        property_address:
          type: string
        transaction_type:
          type: string
          enum: [buy, sell, rent]
        review_date:
          type: string
          format: date
        rating_communication:
          type: integer
          minimum: 1
          maximum: 5
        rating_negotiation:
          type: integer
          minimum: 1
          maximum: 5
        rating_market_knowledge:
          type: integer
          minimum: 1
          maximum: 5
        rating_responsiveness:
          type: integer
          minimum: 1
          maximum: 5
        rating_pricing:
          type: integer
          minimum: 1
          maximum: 5
        rating_paperwork:
          type: integer
          minimum: 1
          maximum: 5
        rating_availability:
          type: integer
          minimum: 1
          maximum: 5
        rating_recommendation:
          type: integer
          minimum: 1
          maximum: 5

    Referral:
      type: object
      properties:
        id:
          type: integer
        sender_id:
          type: integer
        receiver_id:
          type: integer
        client_name:
          type: string
        property_type:
          type: string
        transaction_type:
          type: string
        budget_min:
          type: integer
          nullable: true
        budget_max:
          type: integer
          nullable: true
        location:
          type: string
        timeline:
          type: string
          nullable: true
        referral_fee_percent:
          type: number
          nullable: true
        status:
          type: string
          enum: [PENDING, ACCEPTED, DECLINED, IN_PROGRESS, COMPLETED, CANCELLED]
        message:
          type: string
          nullable: true
        response_message:
          type: string
          nullable: true
        sale_price:
          type: integer
          nullable: true
        commission_amount:
          type: integer
          nullable: true
        referral_fee_paid:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        responded_at:
          type: string
          format: date-time
          nullable: true
        accepted_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true

    ReferralCreate:
      type: object
      required: [receiver_id, client_name, transaction_type, location]
      properties:
        receiver_id:
          type: integer
        client_name:
          type: string
          maxLength: 200
        client_email:
          type: string
          format: email
        client_phone:
          type: string
        property_type:
          type: string
          enum: [residential, commercial, investment, land]
        transaction_type:
          type: string
          enum: [buy, sell, rent]
        budget_min:
          type: integer
        budget_max:
          type: integer
        location:
          type: string
          maxLength: 200
        timeline:
          type: string
        notes:
          type: string
        referral_fee_percent:
          type: number
          minimum: 0
          maximum: 50
        message:
          type: string

    Lead:
      type: object
      properties:
        id:
          type: integer
        agent_id:
          type: integer
        name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        looking_for:
          type: string
          enum: [buy, sell, rent, invest]
        property_type:
          type: string
          nullable: true
        budget_min:
          type: integer
          nullable: true
        budget_max:
          type: integer
          nullable: true
        location:
          type: string
          nullable: true
        status:
          type: string
          enum: [NEW, CONTACTED, QUALIFIED, CONVERTED, CLOSED]
        source:
          type: string
        created_at:
          type: string
          format: date-time
        contacted_at:
          type: string
          format: date-time
          nullable: true

    LeadCreate:
      type: object
      required: [agent_id, name, looking_for]
      properties:
        agent_id:
          type: integer
        name:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
        phone:
          type: string
        message:
          type: string
        looking_for:
          type: string
          enum: [buy, sell, rent, invest]
        property_type:
          type: string
        budget_min:
          type: integer
        budget_max:
          type: integer
        location:
          type: string
        timeline:
          type: string
        source:
          type: string
          enum: [topagents_search, agent_profile, city_page, quiz, direct]

    Tier:
      type: object
      properties:
        tier_name:
          type: string
        min_points:
          type: integer
        max_points:
          type: integer
          nullable: true
        tier_order:
          type: integer
        min_reviews:
          type: integer
        min_avg_rating:
          type: number
        min_platforms_connected:
          type: integer
        color_hex:
          type: string

    City:
      type: object
      properties:
        id:
          type: integer
        city_name:
          type: string
        region:
          type: string
        province:
          type: string
        slug:
          type: string
        population:
          type: integer
          nullable: true
        avg_home_price:
          type: integer
          nullable: true
        total_agents:
          type: integer
        seo_title:
          type: string
          nullable: true
        seo_description:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        top_agents:
          type: array
          items:
            type: object

  responses:
    Unauthorized:
      description: Missing or invalid JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient role permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Input validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

paths:

  # ─── AUTH ──────────────────────────────────────────────────────────────────

  /auth/signup:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, first_name, last_name]
              properties:
                email:
                  type: string
                  format: email
                  example: jane@example.com
                password:
                  type: string
                  minLength: 8
                  example: Secret123
                first_name:
                  type: string
                  example: Jane
                last_name:
                  type: string
                  example: Smith
                role:
                  type: string
                  enum: [consumer, agent, brokerage]
                  default: consumer
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      message:
                        type: string
        '409':
          description: Email already registered
        '422':
          description: Validation error

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: jane@example.com
                password:
                  type: string
                  example: Secret123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials

  /auth/social-login:
   post:
    tags: [Auth]
    summary: Login with Google or Facebook
    description: Social login using OAuth provider token (Google/Facebook)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - provider
              - token
            properties:
              provider:
                type: string
                enum: [google, facebook]
                example: google

              token:
                type: string
                example: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
    responses:
      '200':
        description: Login successful, returns JWT tokens and user data
        content:
          application/json:
            example:
              success: true
              data:
                accessToken: "jwt_access_token_here"
                refreshToken: "jwt_refresh_token_here"
                user:
                  id: 1
                  name: "John Doe"
                  email: "john@example.com"
                  provider: "google"
      '401':
        description: Invalid token or authentication failed
        content:
          application/json:
            example:
              success: false
              message: "Invalid token"

  /auth/scrape-zillow-agent:
   post:
    tags: [Auth]
    summary: Scrape Zillow agent data (Admin only)
    description: Protected API for admin users only
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Scraping successful
        content:
          application/json:
            example:
              success: true
              message: "Scraping completed successfully"
      '401':
        description: Unauthorized (No token or invalid token)
        content:
          application/json:
            example:
              success: false
              message: "Scraping failed"


  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token and get a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: New tokens issued
        '401':
          description: Invalid or expired refresh token

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Logged out successfully

  /auth/verify-email/{token}:
    get:
      tags: [Auth]
      summary: Verify email address via token
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Email verified
        '400':
          description: Invalid or expired token

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email sent (always 200 to avoid email enumeration)

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using token from email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password reset successfully
        '400':
          description: Invalid or expired token

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    put:
      tags: [Auth]
      summary: Change password for the authenticated user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password changed
        '401':
          description: Incorrect current password

  # ─── AGENTS ────────────────────────────────────────────────────────────────

  /agents:
    get:
      tags: [Agents]
      summary: Search and filter agents
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Search by name or brokerage
        - in: query
          name: city
          schema:
            type: string
        - in: query
          name: province
          schema:
            type: string
        - in: query
          name: min_rating
          schema:
            type: number
            minimum: 1
            maximum: 5
        - in: query
          name: tier
          schema:
            type: string
            enum: [BRONZE, SILVER, GOLD, PLATINUM, DIAMOND, LUMINARY]
        - in: query
          name: specialties
          schema:
            type: string
          description: Comma-separated list
        - in: query
          name: languages
          schema:
            type: string
          description: Comma-separated list
        - in: query
          name: sort
          schema:
            type: string
            enum: [rating, reviews, recent, points]
            default: rating
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Paginated list of agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Agent'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      tags: [Agents]
      summary: Create agent profile (admin or bulk seed)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreate'
      responses:
        '201':
          description: Agent created
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: License number already exists

  /agents/alldata:
    get:
      summary: Get dashboard statistics
      tags: [Agents]
      responses:
        200:
          description: Dashboard statistics fetched successfully
          content:
            application/json:
              example:
                success: true
                totalCities: 46
                cities:
                  - Toronto
                  - Vancouver
                  - Calgary
                totalAgents: 120
                totalReviews: 5420
    
  /agents/allbadges:
    get:
      summary: Get all badges
      tags:
        - Agents
      description: Retrieves a list of all badges available in the system.
