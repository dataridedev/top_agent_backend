    get:
      tags: [Points & Tiers]
      summary: List connected review platforms for an agent
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Array of platform connections with sync status

    post:
      tags: [Points & Tiers]
      summary: Connect a review platform (awards 75pts first, 35pts each additional)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform]
              properties:
                platform:
                  type: string
                  enum: [google, rew, ratemyagent, ratemyagentcom, facebook, zillow, yelp]
                platform_account_id:
                  type: string
                credentials:
                  type: object
                  description: OAuth tokens — stored encrypted in JSONB
      responses:
        '200':
          description: Platform connected and points awarded

