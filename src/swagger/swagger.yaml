    delete:
      tags: [Points & Tiers]
      summary: Disconnect a review platform
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: integer
        - in: path
          name: platform
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Platform disconnected

