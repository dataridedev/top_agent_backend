            type: integer
      responses:
        '200':
          description: Current tier, year_points, next tier, and all tier definitions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      current_tier:
                        type: string
                      year_points:
