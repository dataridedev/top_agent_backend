      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated flagged review reports

  /admin/agents/{agentId}/suspend:
    patch:
      tags: [Admin]
      summary: Suspend or reactivate an agent profile
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suspended]
              properties:
                suspended:
                  type: boolean
                reason:
                  type: string
      responses:
        '200':
          description: Agent suspended or reactivated

  /admin/tiers/recalculate:
    post:
      tags: [Admin]
      summary: Manually trigger nightly tier recalculation for all agents
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tier recalculation complete
