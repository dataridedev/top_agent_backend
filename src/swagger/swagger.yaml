        '200':
          description: Import summary

  /reviews/add:
    post:
      tags: [Reviews]
      summary: Add review (custom API)
      description: Allows user to add a review for an agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
      responses:
        '201':
          description: Review added successfully

  /reviews/{reviewId}:
    get:
      tags: [Reviews]
      summary: Get a single review by ID
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Review object

  /reviews/{reviewId}/reply:
    post:
      tags: [Reviews]
      summary: Agent replies to a review (awards 10 points)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response:
                  type: string
      responses:
        '200':
          description: Reply saved

  /reviews/{reviewId}/report:
    post:
      tags: [Reviews]
      summary: Report a review for moderation
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Review reported

  /reviews/{reviewId}/verify:
    patch:
      tags: [Reviews]
      summary: Admin verifies a review
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Review verified

  # ─── REFERRALS ─────────────────────────────────────────────────────────────

  /referrals:
    get:
      tags: [Referrals]
      summary: List referrals for the authenticated agent
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: direction
          schema:
            type: string
            enum: [sent, received, all]
            default: all
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, ACCEPTED, DECLINED, IN_PROGRESS, COMPLETED, CANCELLED]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated referrals
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Referral'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      tags: [Referrals]
      summary: Send a new referral to another agent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReferralCreate'
      responses:
        '201':
          description: Referral created with PENDING status
        '400':
          description: Cannot refer to yourself
        '404':
          description: One or both agents not found

  /referrals/{referralId}:
    get:
      tags: [Referrals]
      summary: Get referral details
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: referralId
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Referral with sender and receiver info
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Referral'
        '404':
          $ref: '#/components/responses/NotFound'

  /referrals/{referralId}/respond:
    patch:
      tags: [Referrals]
      summary: Accept, decline, or counter-offer a referral
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: referralId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [accept, decline, counter]
                response_message:
                  type: string
                counter_fee_percent:
                  type: number
                  description: Required when action is counter
      responses:
        '200':
          description: Referral status updated
        '400':
          description: Already responded or invalid status transition

  /referrals/{referralId}/complete:
    patch:
      tags: [Referrals]
      summary: Mark referral as completed — awards 80 points to both agents
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: referralId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sale_price, commission_amount, referral_fee_paid]
              properties:
                sale_price:
                  type: integer
                  description: Final sale price in cents
                  example: 85000000
                commission_amount:
                  type: integer
                  description: Total commission in cents
                  example: 2125000
                referral_fee_paid:
                  type: integer
                  description: Referral fee paid in cents
                  example: 531250
      responses:
        '200':
          description: Referral completed — 80 points awarded to both agents

  # ─── LEADS ─────────────────────────────────────────────────────────────────

  /leads:
    post:
      tags: [Leads]
      summary: Submit a lead — consumer contacts an agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadCreate'
      responses:
        '201':
          description: Lead created and agent notified
        '404':
          description: Agent not found
        '422':
          $ref: '#/components/responses/ValidationError'

    get:
      tags: [Leads]
      summary: List leads for the authenticated agent
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [NEW, CONTACTED, QUALIFIED, CONVERTED, CLOSED]
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated leads
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Lead'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /leads/{leadId}/status:
    patch:
      tags: [Leads]
      summary: Update lead pipeline status — awards points for fast first response
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: leadId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [NEW, CONTACTED, QUALIFIED, CONVERTED, CLOSED]
                notes:
                  type: string
      responses:
        '200':
          description: Status updated. 20pts if responded within 1hr, 10pts within 2hr.
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── CITIES ────────────────────────────────────────────────────────────────

  /cities:
    get:
      tags: [Cities]
      summary: List all BC cities with agent counts
      parameters:
        - in: query
          name: province
          schema:
            type: string
            default: BC
        - in: query
          name: region
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Paginated city list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/City'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
  
  /cities/getcity:
   get:
    tags: [Cities]
    summary: List all cities
    description: Fetches all available cities

    responses:
      '200':
        description: List of cities
        content:
          application/json:
            example:
              success: true
              data:
                - "Chicago"
                - "Sterling"
                - "Evanston"

  /cities/getcityAgents:
   get:
    tags: [Cities]
    summary: Get city-wise agents with pagination
    description: Returns list of cities with agent data
    parameters:
      - in: query
        name: city
        schema:
          type: string
        description: Filter by city name
      - in: query
        name: page
        schema:
          type: integer
          default: 1
      - in: query
        name: limit
        schema:
          type: integer
          default: 20
    responses:
      '200':
        description: Paginated city list with agent counts
        content:
          application/json:
            example:
              success: true
              data:
                cities:
                  - id: 2
                    name: "Bari Levine Bruszer"
                    company_name: "Refine Residential x @properties Christie's International"
                    profile_url: "https://photos.zillowstatic.com/fp/6a55a194295acce5672726239e0479c8-h_l.jpg"
                    about_heading: "Get to know Refine Residential"
                    about_description: "Bari Levine is a top-producing real-estate advisor and founding partner..."
                    city: "Chicago"
              meta:
                page: 1
                limit: 20


  /cities/{slug}:
    get:
      tags: [Cities]
      summary: Get city landing page data with top 6 agents
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
          example: burnaby
      responses:
        '200':
          description: City data including SEO fields and top agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/City'
        '404':
          $ref: '#/components/responses/NotFound'

  # ─── ADMIN ─────────────────────────────────────────────────────────────────


  /admin/createbadges:
    post:
      summary: Create a new badge
      tags:
        - Admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - badge_name
                - badge_icon
              properties:
                badge_name:
                  type: string
                  example: Top Performer
                badge_description:
                  type: string
                  example: Awarded to agents with outstanding performance.
                requirements:
                  type: string
                  example: Complete 100 successful transactions.
                badge_icon:
                  type: string
                  format: binary
                badge_color:
                  type: string
                  example: "#FFD700"
                is_career_badge:
                  type: boolean
                  example: true
                verification:
                  type: string
                  example: verified
                type:
                  type: string
                  example: performance
      responses:
        '201':
          description: Badge created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Badge created successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      badge_name:
                        type: string
                        example: Top Performer
                      badge_description:
                        type: string
                        example: Awarded to agents with outstanding performance.
                      requirements:
                        type: string
                        example: Complete 100 successful transactions.
                      badge_icon:
                        type: string
                        example: https://example.com/badges/top-performer.png
                      badge_color:
                        type: string
                        example: "#FFD700"
                      is_career_badge:
                        type: boolean
                        example: true
                      verification:
                        type: string
                        example: verified
                      type:
                        type: string
                        example: performance
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error

  /admin/dashboard:
    get:
      tags: [Admin]
      summary: Platform KPI overview
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Counts of agents, reviews, users, leads, referrals, flagged reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      agents:
                        type: object
                        properties:
                          total:
                            type: integer
                          claimed:
                            type: integer
                      reviews:
                        type: object
                        properties:
                          total:
                            type: integer
                          verified:
                            type: integer
                      users:
                        type: object
                        properties:
                          total:
                            type: integer
                          agents:
                            type: integer
                      leads:
                        type: object
                        properties:
                          total:
                            type: integer
                          new_leads:
                            type: integer
                      referrals:
                        type: object
                        properties:
                          total:
                            type: integer
                          completed:
                            type: integer
                      flagged_reviews:
                        type: object
                        properties:
                          total:
                            type: integer

  /admin/agents:
    get:
      tags: [Admin]
      summary: List all agents including unclaimed profiles
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [claimed, unclaimed, all]
            default: all
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated full agent list

  /admin/reviews/flagged:
    get:
      tags: [Admin]
      summary: Get flagged reviews pending moderation
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated flagged review reports

  /admin/agents/{agentId}/suspend:
    patch:
      tags: [Admin]
      summary: Suspend or reactivate an agent profile
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: agentId
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suspended]
              properties:
                suspended:
                  type: boolean
                reason:
                  type: string
      responses:
        '200':
          description: Agent suspended or reactivated

  /admin/tiers/recalculate:
    post:
      tags: [Admin]
      summary: Manually trigger nightly tier recalculation for all agents
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tier recalculation complete
