openapi: 3.0.3

info:
  title: TopAgents API
  description: |
    ## TopAgents.ca — Real Estate Agent Review & Referral Platform

    ### Authentication
    Protected endpoints require a `Bearer` JWT token in the `Authorization` header.
    Get tokens via `POST /api/v1/auth/login`. Refresh via `POST /api/v1/auth/refresh`.

    ### Rate Limiting
    - General: 100 req / 15 min
    - Auth endpoints: 10 req / 15 min
    - Search: 60 req / 1 min

    ### Pagination
    All list endpoints accept `?page=1&limit=20`.
    Response includes `meta: { total, page, limit, totalPages, hasNext, hasPrev }`.

    ### Response Envelope
    ```json
    { "success": true, "data": { ... } }
    ```
    ```json
    { "success": false, "error": { "code": 422, "message": "Validation failed", "details": [] } }
    ```
  version: 1.0.0
  contact:
    name: TopAgents Dev Team
    email: dev@topagents.ca

servers:
  - url: http://localhost:2022/api/v1
    description: Local development
  - url: https://api.topagents.ca/api/v1
    description: Production

tags:
  - name: Auth
    description: Authentication, registration, and token management
  - name: Agents
    description: Agent profiles, search, claim, and statistics
  - name: Reviews
    description: Review submission, replies, import, and moderation
  - name: Referrals
    description: Peer-to-peer referral marketplace between agents
  - name: Leads
    description: Consumer lead capture and agent lead pipeline
  - name: Points & Tiers
    description: Points engine, tier progress, and platform connections
  - name: Cities
    description: BC city directory and SEO landing page data
  - name: Admin
    description: Internal admin panel (admin role only)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
        hasNext:
          type: boolean
        hasPrev:
          type: boolean

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          enum: [consumer, agent, brokerage, admin]
        avatar_url:
          type: string
          nullable: true
        is_verified:
          type: boolean
        agent_id:
          type: integer
          nullable: true
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    Agent:
      type: object
      properties:
        id:
          type: integer
        license_number:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        brokerage:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        photo_url:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        languages:
          type: array
          items:
            type: string
        specialties:
          type: array
          items:
            type: string
        areas_served:
          type: array
          items:
            type: string
        claimed_at:
          type: string
          format: date-time
          nullable: true
        verified_at:
          type: string
          format: date-time
          nullable: true
        current_tier:
          type: string
          enum: [BRONZE, SILVER, GOLD, PLATINUM, DIAMOND, LUMINARY]
        total_points:
          type: integer
        year_points:
          type: integer
        avg_rating:
          type: number
          format: float
        total_reviews:
          type: integer
        connected_platforms:
          type: integer
        completed_referrals:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AgentCreate:
      type: object
      required: [license_number, first_name, last_name]
      properties:
        license_number:
          type: string
          maxLength: 50
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        phone:
          type: string
        brokerage:
          type: string
        bio:
          type: string
          maxLength: 2000
        website:
          type: string
          format: uri
        languages:
          type: array
          items:
            type: string
        specialties:
          type: array
          items:
            type: string
        areas_served:
          type: array
          items:
            type: string

    AgentUpdate:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        brokerage:
          type: string
        bio:
          type: string
          maxLength: 2000
        photo_url:
          type: string
        website:
          type: string
          format: uri
        languages:
          type: array
          items:
            type: string
        specialties:
          type: array
          items:
            type: string
        areas_served:
          type: array
          items:
            type: string
        lead_notifications:
          type: boolean
        referral_notifications:
          type: boolean
        marketing_emails:
          type: boolean
     

    # CustomerCreate:
    #   type: object
    #   required: [first_name, last_name, email, phone_number, city, usertype]
    #   properties:
    #     first_name:
    #       type: string
    #     last_name:
    #       type: string
    #     email:
    #       type: string
    #       format: email
    #     phone_number:
    #       type: string
    #     role:
    #       type: string
    #       default: consumer
    #     city:
    #       type: string
    #     address:
    #       type: string
    #     usertype:
    #       type: string
