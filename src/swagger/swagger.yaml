  /agents/customer:
    post:
      tags:
        - Customer
      summary: Create customer profile
      description: Creates a new customer profile and associated user account.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - city
              properties:
                property:
                  type: string
                  example: Condo
                move_time:
                  type: string
                  example: Within 3 months
                city:
                  type: string
                  example: Toronto
                communicate:
                  type: string
                  example: Email
                selling:
                  type: string
                  example: Residential Property
                agent_specialization:
                  type: string
                  example: Luxury Homes
                decision:
                  type: string
                  example: Ready to Buy
                created_at:
                  type: string
                  format: date-time
                  example: "2026-06-16T10:30:00Z"

      responses:
        '201':
          description: Customer created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Customer created successfully
                  data:
                    type: object
        '400':
          description: Validation error
        '401':
          description: Unauthorized

  /agents/getclaimAgent:
    get:
     tags: [Agents]
     summary: Get claimed agent profile (from token)
     description: Returns logged-in agent profile based on JWT token
     security:
      - bearerAuth: []
     responses:
      '200':
        description: Agent profile fetched successfully
        content:
          application/json:
            example:
              success: true
              data:
                id: 1
                name: "John Doe"
                email: "john@example.com"
                role: "agent"
      '401':
        description: Unauthorized - Invalid or missing token
        content:
          application/json:
            example:
              success: false
              message: "Unauthorized"


  /agent/getActiveclaimAgent:
    get:
      tags: [Agents]
      summary: Get active claimed agent profiles
      description: Returns a list of active claimed agent profiles with pagination support.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of records per page
      responses:
        '200':
          description: Active claimed agent profiles fetched successfully
          content:
            application/json:
              example:
                success: true
                data:
                  - realtorID: "12345"
                    firstName: "John"
                    lastName: "Doe"
                    email: "john@example.com"
                    status: "active"
                meta:
                  total: 100
                  page: 1
                  limit: 10
                  totalPages: 10
                  hasNext: true
                  hasPrev: false
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              example:
                success: false
                message: "Unauthorized"
        '403':
          description: Forbidden - User does not have permission
        '500':
          description: Internal server error


  /agents/unclaimed:
   get:
    tags:
      - Agents
    summary: Get all unclaimed agents
    description: Returns a list of agents whose profiles have not yet been claimed.
    security:
      - bearerAuth: []
    responses:
      '200':
        description: List of unclaimed agents fetched successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 1
                      name:
                        type: string
                        example: John Doe
                      claimed_at:
                        type: string
                        nullable: true
                        example: null
      '401':
        description: Unauthorized
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: false
                message:
                  type: string
                  example: Unauthorized


  /agents/getAllAgent:
   get:
    tags: [Agents]
    summary: Get all agent profiles
    description: Returns list of all agents with filters and pagination support
    parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Search by name or brokerage
      - in: query
        name: city
        schema:
          type: string
      - in: query
        name: province
        schema:
          type: string
      - in: query
        name: min_rating
        schema:
          type: number
          minimum: 1
          maximum: 5
      - in: query
        name: tier
        schema:
          type: string
          enum: [BRONZE, SILVER, GOLD, PLATINUM, DIAMOND, LUMINARY]
      - in: query
        name: specialties
        schema:
          type: string
        description: Comma-separated list
      - in: query
        name: languages
        schema:
          type: string
        description: Comma-separated list
      - in: query
        name: sort
        schema:
          type: string
          enum: [rating, reviews, recent, points]
          default: rating
      - in: query
        name: page
        schema:
          type: integer
          default: 1
      - in: query
        name: limit
        schema:
          type: integer
          default: 20
          maximum: 100
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/Agent'
                meta:
                  $ref: '#/components/schemas/PaginationMeta'
    
  /agent/getuserinfo:
   get:
    tags: [Agents]
    summary: Get full agent profile by ID
    description: Returns agent profile using agentId query parameter
    parameters:
      - in: query
        name: agentId
        required: true
        schema:
          type: integer
        description: Unique agent ID
    security:
      - bearerAuth: []
    responses:
      '200':
        description: User profile fetched successfully
        content:
          application/json:
            example:
              success: true
              data:
                id: 1
                name: "John Doe"
                email: "john@example.com"
                city: "Nagpur"
      '404':
        description: User not found
        content:
          application/json:
            example:
              success: false
              message: "User not found"
      '401':
        description: Unauthorized
        content:
          application/json:
            example:
              success: false
              message: "Unauthorized"

   post:
      tags: [Agents]
      summary: Create agent profile (admin or bulk seed)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreate'
      responses:
        '201':
          description: Agent created
