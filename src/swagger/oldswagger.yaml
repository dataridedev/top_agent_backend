openapi: 3.0.3

info:
  title: TopAgents API
  description: |
    ## TopAgents.ca — Real Estate Agent Review & Referral Platform

    Full REST API for the TopAgents SaaS platform.

    ### Authentication
    All protected endpoints require a `Bearer` JWT access token in the `Authorization` header.
    Obtain tokens via `POST /api/v1/auth/login`.
    Refresh tokens via `POST /api/v1/auth/refresh`.

    ### Rate Limiting
    - General endpoints: 100 requests / 15 minutes
    - Auth endpoints: 10 requests / 15 minutes
    - Search endpoints: 60 requests / 1 minute

    ### Pagination
    All list endpoints accept `?page=1&limit=20`.
    Response includes a `meta` object: `{ total, page, limit, totalPages, hasNext, hasPrev }`.

    ### Error Format
    ```json
    {
      "success": false,
      "error": {
        "code": 422,
        "message": "Validation failed",
        "details": [{ "field": "email", "message": "Valid email is required" }]
      }
    }
    ```
  version: 1.0.0
  contact:
    name: TopAgents Dev Team
    email: dev@topagents.ca

servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: https://api.topagents.ca/api/v1
    description: Production

tags:
  - name: Auth
    description: Authentication, registration, and token management
  - name: Agents
    description: Agent profiles, search, claim, and statistics
  - name: Reviews
    description: Review submission, replies, import, and moderation
  - name: Referrals
    description: Peer-to-peer referral marketplace between agents
  - name: Leads
    description: Consumer lead capture and agent lead pipeline
  - name: Points & Tiers
    description: Points engine, tier progress, and platform connections
  - name: Cities
    description: BC city directory and SEO landing page data
  - name: Admin
    description: Internal admin panel (admin role only)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # ── Pagination Meta ───────────────────────────────────────────────────────
    PaginationMeta:
      type: object
      properties:
        total:      { type: integer }
        page:       { type: integer }
        limit:      { type: integer }
        totalPages: { type: integer }
        hasNext:    { type: boolean }
        hasPrev:    { type: boolean }

    # ── Error ─────────────────────────────────────────────────────────────────
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code:    { type: integer }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field:   { type: string }
                  message: { type: string }

    # ── User ──────────────────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:           { type: integer }
        email:        { type: string, format: email }
        first_name:   { type: string }
        last_name:    { type: string }
        role:         { type: string, enum: [consumer, agent, brokerage, admin] }
        avatar_url:   { type: string, nullable: true }
        is_verified:  { type: boolean }
        agent_id:     { type: integer, nullable: true }
        last_login_at: { type: string, format: date-time, nullable: true }
        created_at:   { type: string, format: date-time }
         phone: { type: string, nullable: true }
        company_name: { type: string, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }

    # ── Agent ─────────────────────────────────────────────────────────────────
    Agent:
      type: object
      properties:
        id:              { type: integer }
        license_number:  { type: string }
        first_name:      { type: string }
        last_name:       { type: string }
        email:           { type: string, format: email, nullable: true }
        phone:           { type: string, nullable: true }
        brokerage:       { type: string, nullable: true }
        bio:             { type: string, nullable: true }
        photo_url:       { type: string, nullable: true }
        website:         { type: string, nullable: true }
        languages:       { type: array, items: { type: string } }
        specialties:     { type: array, items: { type: string } }
        areas_served:    { type: array, items: { type: string } }
        claimed_at:      { type: string, format: date-time, nullable: true }
        verified_at:     { type: string, format: date-time, nullable: true }
        current_tier:    { type: string, enum: [BRONZE, SILVER, GOLD, PLATINUM, DIAMOND, LUMINARY] }
        total_points:    { type: integer }
        year_points:     { type: integer }
        avg_rating:      { type: number, format: float }
        total_reviews:   { type: integer }
        connected_platforms: { type: integer }
        completed_referrals: { type: integer }
        created_at:      { type: string, format: date-time }
        updated_at:      { type: string, format: date-time }

    AgentCreate:
      type: object
      required: [license_number, first_name, last_name]
      properties:
        license_number: { type: string, maxLength: 50 }
        first_name:     { type: string, maxLength: 100 }
        last_name:      { type: string, maxLength: 100 }
        email:          { type: string, format: email }
        phone:          { type: string }
        brokerage:      { type: string }
        bio:            { type: string, maxLength: 2000 }
        website:        { type: string, format: uri }
        languages:      { type: array, items: { type: string } }
        specialties:    { type: array, items: { type: string } }
        areas_served:   { type: array, items: { type: string } }

    AgentUpdate:
      type: object
      properties:
        first_name:             { type: string }
        last_name:              { type: string }
        email:                  { type: string, format: email }
        phone:                  { type: string }
        brokerage:              { type: string }
        bio:                    { type: string, maxLength: 2000 }
        photo_url:              { type: string }
        website:                { type: string, format: uri }
        languages:              { type: array, items: { type: string } }
        specialties:            { type: array, items: { type: string } }
        areas_served:           { type: array, items: { type: string } }
        lead_notifications:     { type: boolean }
        referral_notifications: { type: boolean }
        marketing_emails:       { type: boolean }

    # ── Review ────────────────────────────────────────────────────────────────
    Review:
      type: object
      properties:
        id:                    { type: integer }
        agent_id:              { type: integer }
        platform:              { type: string }
        rating:                { type: integer, minimum: 1, maximum: 5 }
        title:                 { type: string, nullable: true }
        text:                  { type: string, nullable: true }
        reviewer_name:         { type: string }
        verified:              { type: boolean }
        transaction_verified:  { type: boolean }
        review_date:           { type: string, format: date }
        agent_responded:       { type: boolean }
        agent_response:        { type: string, nullable: true }
        response_date:         { type: string, format: date-time, nullable: true }
        property_address:      { type: string, nullable: true }
        transaction_type:      { type: string, nullable: true }
        rating_communication:  { type: integer, nullable: true }
        rating_negotiation:    { type: integer, nullable: true }
        rating_market_knowledge: { type: integer, nullable: true }
        rating_responsiveness: { type: integer, nullable: true }
        rating_pricing:        { type: integer, nullable: true }
        rating_paperwork:      { type: integer, nullable: true }
        rating_availability:   { type: integer, nullable: true }
        rating_recommendation: { type: integer, nullable: true }
        imported_at:           { type: string, format: date-time }

    ReviewCreate:
      type: object
      required: [agent_id, rating, reviewer_name, reviewer_email]
      properties:
        agent_id:        { type: integer }
        rating:          { type: integer, minimum: 1, maximum: 5 }
        reviewer_name:   { type: string, maxLength: 100 }
        reviewer_email:  { type: string, format: email }
        title:           { type: string, maxLength: 200 }
        text:            { type: string, maxLength: 5000 }
        platform:        { type: string, enum: [native, google, rew, ratemyagent, ratemyagentcom, facebook, zillow] }
        platform_review_id: { type: string }
        platform_url:    { type: string, format: uri }
        property_address:   { type: string }
        transaction_type:   { type: string, enum: [buy, sell, rent] }
        review_date:        { type: string, format: date }
        rating_communication:    { type: integer, minimum: 1, maximum: 5 }
        rating_negotiation:      { type: integer, minimum: 1, maximum: 5 }
        rating_market_knowledge: { type: integer, minimum: 1, maximum: 5 }
        rating_responsiveness:   { type: integer, minimum: 1, maximum: 5 }
        rating_pricing:          { type: integer, minimum: 1, maximum: 5 }
        rating_paperwork:        { type: integer, minimum: 1, maximum: 5 }
        rating_availability:     { type: integer, minimum: 1, maximum: 5 }
        rating_recommendation:   { type: integer, minimum: 1, maximum: 5 }

    # ── Referral ──────────────────────────────────────────────────────────────
    Referral:
      type: object
      properties:
        id:                  { type: integer }
        sender_id:           { type: integer }
        receiver_id:         { type: integer }
        client_name:         { type: string }
        property_type:       { type: string }
        transaction_type:    { type: string }
        budget_min:          { type: integer, nullable: true }
        budget_max:          { type: integer, nullable: true }
        location:            { type: string }
        timeline:            { type: string, nullable: true }
        referral_fee_percent:{ type: number, nullable: true }
        status:              { type: string, enum: [PENDING, ACCEPTED, DECLINED, IN_PROGRESS, COMPLETED, CANCELLED] }
        message:             { type: string, nullable: true }
        response_message:    { type: string, nullable: true }
        sale_price:          { type: integer, nullable: true }
        commission_amount:   { type: integer, nullable: true }
        referral_fee_paid:   { type: integer, nullable: true }
        created_at:          { type: string, format: date-time }
        responded_at:        { type: string, format: date-time, nullable: true }
        accepted_at:         { type: string, format: date-time, nullable: true }
        completed_at:        { type: string, format: date-time, nullable: true }

    ReferralCreate:
      type: object
      required: [receiver_id, client_name, transaction_type, location]
      properties:
        receiver_id:         { type: integer }
        client_name:         { type: string, maxLength: 200 }
        client_email:        { type: string, format: email }
        client_phone:        { type: string }
        property_type:       { type: string, enum: [residential, commercial, investment, land] }
        transaction_type:    { type: string, enum: [buy, sell, rent] }
        budget_min:          { type: integer }
        budget_max:          { type: integer }
        location:            { type: string, maxLength: 200 }
        timeline:            { type: string }
        notes:               { type: string }
        referral_fee_percent:{ type: number, minimum: 0, maximum: 50 }
        message:             { type: string }

    # ── Lead ──────────────────────────────────────────────────────────────────
    Lead:
      type: object
      properties:
        id:           { type: integer }
        agent_id:     { type: integer }
        name:         { type: string }
        email:        { type: string, nullable: true }
        phone:        { type: string, nullable: true }
        message:      { type: string, nullable: true }
        looking_for:  { type: string, enum: [buy, sell, rent, invest] }
        property_type:{ type: string, nullable: true }
        budget_min:   { type: integer, nullable: true }
        budget_max:   { type: integer, nullable: true }
        location:     { type: string, nullable: true }
        status:       { type: string, enum: [NEW, CONTACTED, QUALIFIED, CONVERTED, CLOSED] }
        source:       { type: string }
        created_at:   { type: string, format: date-time }
        contacted_at: { type: string, format: date-time, nullable: true }

    LeadCreate:
      type: object
      required: [agent_id, name, looking_for]
      properties:
        agent_id:     { type: integer }
        name:         { type: string, maxLength: 200 }
        email:        { type: string, format: email }
        phone:        { type: string }
        message:      { type: string }
        looking_for:  { type: string, enum: [buy, sell, rent, invest] }
        property_type:{ type: string }
        budget_min:   { type: integer }
        budget_max:   { type: integer }
        location:     { type: string }
        timeline:     { type: string }
        source:       { type: string, enum: [topagents_search, agent_profile, city_page, quiz, direct] }

    # ── Tier ──────────────────────────────────────────────────────────────────
    Tier:
      type: object
      properties:
        tier_name:               { type: string }
        min_points:              { type: integer }
        max_points:              { type: integer, nullable: true }
        tier_order:              { type: integer }
        min_reviews:             { type: integer }
        min_avg_rating:          { type: number }
        min_platforms_connected: { type: integer }
        color_hex:               { type: string }

    # ── City ──────────────────────────────────────────────────────────────────
    City:
      type: object
      properties:
        id:              { type: integer }
        city_name:       { type: string }
        region:          { type: string }
        province:        { type: string }
        slug:            { type: string }
        population:      { type: integer, nullable: true }
        avg_home_price:  { type: integer, nullable: true }
        total_agents:    { type: integer }
        seo_title:       { type: string, nullable: true }
        seo_description: { type: string, nullable: true }
        latitude:        { type: number, nullable: true }
        longitude:       { type: number, nullable: true }
        top_agents:      { type: array, items: { $ref: '#/components/schemas/Agent' } }

  responses:
    Unauthorized:
      description: Missing or invalid JWT token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Insufficient role permissions
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Input validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
